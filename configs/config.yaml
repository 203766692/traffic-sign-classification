# Dataset and experiment configuration
data_root: "data/gtsrb"
num_classes: 43
image_size: 224
batch_size: 32
num_epochs: 20
learning_rate: 0.0001
model_name: "resnet18"       # Options: resnet18 / mobilenet_v3 / vit
freeze_backbone: true        # true means linear probing; false means fine-tuning
seed: 42
output_dir: "experiments"
